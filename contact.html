<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Group 3 Contact</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>
<body>

<header class="site-header">
    <h1>GROUP 3 PHARMACY WEBSITE</h1>
    <button class="menu-toggle" aria-label="Toggle navigation"
            aria-expanded="false">&#9776;</button>

    <nav class="navigation">
        <a href="index.html">Home</a>
        <a href="gallery.html">Gallery</a>
        <a href="blog.html">Blog</a>
        <a href="contact.html" class="active">Contact</a>
    </nav>
</header>

<main class="content-section">
    <h2>Contact Us</h2>
    <p>Complete the form below to send us a message.</p>

    <form id="contactForm" class="contact-form">

        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name"
               placeholder="Enter your full name" required>

        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email"
               placeholder="example@email.com" required>

        <label for="subject">Subject:</label>
        <input type="text" id="subject" name="subject"
               placeholder="Enter the subject" required>

        <fieldset>
            <legend>Preferred Contact Method:</legend>

            <label class="inline-option">
                <input type="radio" name="contactMethod"
                       value="Email" required>
                Email
            </label>

            <label class="inline-option">
                <input type="radio" name="contactMethod"
                       value="Phone">
                Phone
            </label>
        </fieldset>

        <fieldset>
            <legend>Subscriptions:</legend>

            <label class="inline-option">
                <input type="checkbox" name="newsletter"
                       value="Yes">
                Subscribe to Newsletter
            </label>

            <label class="inline-option">
                <input type="checkbox" name="updates"
                       value="Yes">
                Receive Updates
            </label>
        </fieldset>

        <label for="reason">Reason for Contact:</label>
        <select id="reason" name="reason" required>
            <option value="">-- Select a reason --</option>
            <option value="Feedback">Feedback</option>
            <option value="Support">Support</option>
            <option value="Collaboration">Collaboration</option>
        </select>

        <label for="message">Detailed Message:</label>
        <textarea id="message" name="message" rows="6"
                  placeholder="Write your message here..."
                  required></textarea>

        <div class="form-buttons">
            <button type="submit" class="btn">Submit</button>
            <button type="reset" class="btn reset-btn">Reset</button>
        </div>

        <p id="formStatus" role="status" aria-live="polite"></p>

    </form>
</main>

<footer class="site-footer">
    <p>&copy; 2026 Group 3 Pharmacy Mini Website. All rights reserved.</p>
    <div class="social-links">
        <a href="https://www.facebook.com/" target="_blank"
           rel="noopener">Facebook</a>
        <a href="https://www.instagram.com/" target="_blank"
           rel="noopener">Instagram</a>
        <a href="https://www.linkedin.com/" target="_blank"
           rel="noopener">LinkedIn</a>
    </div>
</footer>

</body>
</html>
